<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murly Bowling: a team quiz game for English lessons | Murly</title>
<link rel="icon" href="/favicon.svg">
<meta name="description" content="Murly Bowling: answer English questions, roll the ball and knock down the pins. A team game for online and classroom lessons.">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2b2f55;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#17181C;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:center center;overflow:hidden;border-radius:18px;user-select:none}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
.bg{position:absolute;inset:0}
h1,h2,.fx{font-family:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif;letter-spacing:.5px}
.btn{font:900 30px/1 "Arial Black",Impact,sans-serif;color:#fff;background:#FF9F1C;border:4px solid #17181C;border-radius:14px;padding:16px 46px;cursor:pointer;box-shadow:6px 6px 0 #17181C;transform:skewX(-8deg);text-transform:uppercase}
.btn:active{transform:skewX(-8deg) translate(3px,3px);box-shadow:3px 3px 0 #17181C}
.btn.sm{font-size:18px;padding:10px 20px;box-shadow:4px 4px 0 #17181C}
.btn.pink{background:#F472B6}.btn.blue{background:#5B8DEF}.btn.green{background:#3DBE6E}.btn.red{background:#E5484D}.btn.ghost{background:#fff;color:#17181C}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.88);border:4px solid #17181C;border-radius:26px;box-shadow:10px 10px 0 rgba(23,24,28,.85);padding:34px 46px}
.logo{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:20px}
.logo h1{margin:0;font-size:68px;color:#fff;-webkit-text-stroke:3px #3D2E8C;text-shadow:5px 5px 0 #3D2E8C}
.logo small{display:block;font:900 26px "Arial Black",sans-serif;color:#F472B6;-webkit-text-stroke:1px #3D2E8C;text-align:center}
.row{display:grid;grid-template-columns:230px 560px 90px;align-items:center;gap:18px;margin:16px 0}
.row label{font:900 26px "Arial Black",sans-serif;text-transform:uppercase}
.row .v{font:900 30px "Arial Black",sans-serif;text-align:center}
input[type=range]{width:100%;accent-color:#5B4BC4;height:28px}
.themes{display:flex;gap:12px;justify-content:center;margin:10px 0 6px}
.th{width:120px;height:86px;border:4px solid #17181C;border-radius:16px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;font:900 15px "Arial Black",sans-serif;color:#fff;-webkit-text-stroke:1px #17181C;padding-bottom:6px;position:relative;overflow:hidden}
.th.sel{outline:6px solid #FF9F1C;outline-offset:3px}
.sets{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.chip{font:800 17px system-ui;border:3px solid #17181C;background:#fff;border-radius:999px;padding:7px 16px;cursor:pointer}
.chip.sel{background:#FFE07A}
textarea{width:100%;height:330px;font:16px/1.5 Consolas,monospace;border:3px solid #17181C;border-radius:14px;padding:12px}
.teams{display:flex;gap:40px;justify-content:center;margin:30px 0}
.tm{text-align:center;cursor:pointer}
.tm .ball{width:120px;height:120px;margin:0 auto 12px;transition:transform .2s}
.tm:hover .ball{transform:scale(1.08) rotate(-10deg)}
.tm input{font:900 22px "Arial Black",sans-serif;width:200px;text-align:center;background:#F472B6;color:#fff;border:4px solid #17181C;border-radius:10px;padding:8px;box-shadow:4px 4px 0 #17181C;-webkit-text-stroke:.5px #17181C}
.grid{display:grid;grid-template-columns:repeat(8,110px);gap:18px 22px;justify-content:center}
.gb{text-align:center;cursor:pointer}
.gb svg{width:88px;height:88px;transition:transform .15s}
.gb:hover svg{transform:scale(1.12)}
.gb .lb{font:900 13px "Arial Black",sans-serif;background:#F472B6;color:#fff;border:3px solid #17181C;border-radius:8px;padding:2px 6px;margin-top:4px;min-height:24px}
.gb.taken .lb{background:#5BC0F8}
.gb.cur svg{filter:drop-shadow(0 0 0 #FF9F1C) drop-shadow(0 0 10px #FF9F1C)}
/* game */
#lane{position:absolute;inset:0}
.hud-l{position:absolute;left:24px;top:20px;color:#fff;font:900 54px/1 "Arial Black",sans-serif;-webkit-text-stroke:2px #17181C;text-shadow:3px 3px 0 #17181C}
.hud-l small{display:block;font-size:20px;-webkit-text-stroke:1px #17181C}
.board{position:absolute;right:20px;top:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.sc{display:flex;align-items:center;gap:0;font:900 26px "Arial Black",sans-serif}
.sc .n{background:#5BC0F8;color:#fff;-webkit-text-stroke:1px #17181C;border:4px solid #17181C;border-radius:10px 0 0 10px;padding:6px 16px 6px 18px;transform:skewX(-8deg);box-shadow:4px 4px 0 #17181C}
.sc:nth-child(2) .n{background:#F472B6}.sc:nth-child(3) .n{background:#3DBE6E}.sc:nth-child(4) .n{background:#FF9F1C}
.sc .p{background:#fff;border:4px solid #17181C;border-radius:999px;min-width:62px;height:62px;display:grid;place-items:center;margin-left:-10px;position:relative;z-index:1;box-shadow:4px 4px 0 #17181C}
.sc .p svg{position:absolute;inset:-4px;width:62px;height:62px;opacity:.35}
.sc .p b{position:relative}
.sc.on .n{outline:5px solid #FFE07A}
.sc.bump .p{animation:bump .5s}
@keyframes bump{50%{transform:scale(1.35)}}
.pin{position:absolute;transform-origin:50% 92%;transition:transform .55s cubic-bezier(.3,.7,.4,1),opacity .6s;will-change:transform}
.pin svg{width:100%;height:100%;display:block}
.pin.fall{opacity:.0}
.bowl{position:absolute;will-change:transform,left,top,width}
.bowl svg{width:100%;height:100%;display:block}
.meter{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;display:flex;border:4px solid #17181C;border-radius:8px;overflow:hidden;box-shadow:5px 5px 0 rgba(0,0,0,.35)}
.meter div{width:92px;height:64px;display:grid;place-items:center;font:900 38px "Arial Black",sans-serif;color:#fff;-webkit-text-stroke:1.5px #17181C}
.meter .ptr{position:absolute;top:-16px;width:18px;height:96px;background:#fff;border:4px solid #17181C;border-radius:8px;transform:translateX(-50%);box-shadow:0 0 12px #fff}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;font:900 24px "Arial Black",sans-serif;color:#fff;-webkit-text-stroke:1px #17181C;text-shadow:2px 2px 0 #17181C;white-space:nowrap}
.pw{position:absolute;left:46px;bottom:110px;width:150px;height:150px;cursor:pointer;animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(-4deg)}}
.pw .t{position:absolute;bottom:18px;left:0;right:0;text-align:center;font:900 15px "Arial Black",sans-serif;color:#fff;-webkit-text-stroke:1px #17181C}
.big{position:absolute;left:0;right:0;top:36%;text-align:center;font:900 110px "Arial Black",Impact,sans-serif;color:#fff;-webkit-text-stroke:5px #3D2E8C;text-shadow:8px 8px 0 #3D2E8C;opacity:0;transform:scale(.4);transition:all .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.big.show{opacity:1;transform:scale(1)}
.qbox{position:absolute;inset:0;background:rgba(20,22,45,.55);display:none;align-items:center;justify-content:center}
.qbox.on{display:flex}
.qcard{width:900px;background:#fff;border:5px solid #17181C;border-radius:28px;box-shadow:12px 12px 0 #17181C;padding:30px 40px;text-align:center;position:relative}
.qcard .who{position:absolute;top:-28px;left:50%;transform:translateX(-50%) skewX(-8deg);background:#5BC0F8;border:4px solid #17181C;border-radius:10px;padding:6px 22px;font:900 24px "Arial Black",sans-serif;color:#fff;-webkit-text-stroke:1px #17181C;display:flex;gap:10px;align-items:center}
.qcard .who svg{width:34px;height:34px}
.qcard img{max-width:100%;height:280px;object-fit:cover;border-radius:16px;border:3px solid #17181C;margin-bottom:12px}
.qcard .q{font:800 38px/1.25 system-ui,sans-serif;margin:14px 0 22px}
.qcard .ans{font:900 40px "Arial Black",sans-serif;color:#3DBE6E;margin:-6px 0 18px;min-height:46px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.opts button{font:800 28px system-ui;border:4px solid #17181C;background:#fff;border-radius:16px;padding:14px;cursor:pointer;box-shadow:4px 4px 0 #17181C}
.opts button.ok{background:#B9EBC8}.opts button.bad{background:#F8C4C4}
.qbtns{display:flex;gap:18px;justify-content:center}
.end{text-align:center}
.end h2{font-size:84px;margin:0;color:#fff;-webkit-text-stroke:4px #3D2E8C;text-shadow:7px 7px 0 #3D2E8C}
.podium{display:flex;gap:30px;justify-content:center;align-items:flex-end;margin:30px 0}
.podium div{text-align:center;font:900 26px "Arial Black",sans-serif}
.podium svg{width:110px;height:110px}
.cf{position:absolute;width:14px;height:22px;top:-30px;animation:cf 2.6s linear forwards}
@keyframes cf{to{transform:translateY(900px) rotate(720deg)}}
.corner{position:absolute;top:18px;display:flex;gap:10px}
.mute{position:absolute;right:20px;bottom:18px}
.small{font-size:15px;color:#555;margin-top:8px}
</style>
</head>
<body>
<div id="stage">
  <div class="bg" id="bg"></div>

  <!-- 1. setup -->
  <div class="scr on" id="sSetup">
    <div class="panel" style="width:1000px">
      <div class="logo"><span id="logoBall"></span><div><h1>Murly Bowling</h1><small id="thName">Classic</small></div></div>
      <div class="row"><label>Teams</label><input type="range" id="rTeams" min="1" max="4" value="2"><div class="v" id="vTeams">2</div></div>
      <div class="row"><label>Shots</label><input type="range" id="rShots" min="2" max="40" step="2" value="16"><div class="v" id="vShots">16</div></div>
      <div class="row"><label>Timer</label><input type="range" id="rTime" min="0" max="60" step="10" value="0"><div class="v" id="vTime">OFF</div></div>
      <div class="themes" id="themes"></div>
      <div class="sets" id="sets"></div>
      <div style="text-align:center;margin-top:22px;display:flex;gap:16px;justify-content:center"><button class="btn sm pink" id="bEdit" type="button">Edit questions</button><button class="btn" id="bNext1" type="button">Next</button></div>
    </div>
  </div>

  <!-- 1b. edit -->
  <div class="scr" id="sEdit">
    <div class="panel" style="width:1060px">
      <h2 style="margin:0 0 6px;font-size:34px">Your questions</h2>
      <div class="small" style="margin:0 0 10px">One question per line: <b>question = answer</b>. Optional wrong answers: <b>question = answer | wrong 1 | wrong 2 | wrong 3</b>. They save in this browser.</div>
      <textarea id="tEdit" spellcheck="false"></textarea>
      <div style="text-align:center;margin-top:16px;display:flex;gap:16px;justify-content:center"><button class="btn sm ghost" id="bEditBack" type="button">Back</button><button class="btn sm green" id="bEditSave" type="button">Save</button></div>
    </div>
  </div>

  <!-- 2. teams -->
  <div class="scr" id="sTeams">
    <div class="panel" style="width:1100px;text-align:center">
      <h2 style="margin:0;font-size:52px">Teams</h2>
      <div class="small">Click a ball to change it. Click a name to rename the team.</div>
      <div class="teams" id="teams"></div>
      <div style="display:flex;gap:18px;justify-content:center"><button class="btn sm ghost" id="bBack2" type="button">Back</button><button class="btn sm blue" id="bRandom" type="button">Random</button><button class="btn" id="bStart" type="button">Start</button></div>
    </div>
  </div>

  <!-- 3. ball picker -->
  <div class="scr" id="sBalls">
    <div class="panel" style="width:1180px;text-align:center">
      <h2 style="margin:0 0 18px;font-size:42px" id="pickTitle">Team 1</h2>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <!-- 4. game -->
  <div class="scr" id="sGame">
    <div id="lane"></div>
    <div class="hud-l"><span id="shots">16</span><small>SHOTS LEFT</small></div>
    <div class="board" id="board"></div>
    <div class="big" id="big"></div>
    <div class="qbox" id="qbox"><div class="qcard" id="qcard"></div></div>
  </div>

  <!-- 5. end -->
  <div class="scr" id="sEnd">
    <div class="panel end" style="width:1000px">
      <h2 id="winTitle">Team 1 wins!</h2>
      <div class="podium" id="podium"></div>
      <div style="display:flex;gap:18px;justify-content:center"><button class="btn sm ghost" id="bMenu" type="button">Menu</button><button class="btn" id="bAgain" type="button">Play again</button></div>
    </div>
  </div>
  <button class="btn sm ghost mute" id="bMute" type="button">Sound: on</button>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const sh = (a) => a.map((x) => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map((x) => x[1]);
const rnd = (a, b) => a + Math.random() * (b - a);
const P = new URLSearchParams(location.search);
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };

// ---------- scale ----------
function fit() { const s = Math.min(innerWidth / 1280, innerHeight / 800); $('stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

// ---------- sound (WebAudio, our own) ----------
let MUTE = ls.get('murly:bowl:mute') === '1';
let AC = null; const ac = () => (AC = AC || new (window.AudioContext || window.webkitAudioContext)());
function tone(f, d, type = 'sine', v = .15, slide = 0) { if (MUTE) return; try { const c = ac(), o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f; if (slide) o.frequency.exponentialRampToValueAtTime(slide, c.currentTime + d); g.gain.value = v; g.gain.exponentialRampToValueAtTime(.001, c.currentTime + d); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + d); } catch (e) { } }
function noise(d, v = .25) { if (MUTE) return; try { const c = ac(), b = c.createBuffer(1, c.sampleRate * d, c.sampleRate), a = b.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / a.length); const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; s.buffer = b; g.gain.value = v; s.connect(f).connect(g).connect(c.destination); s.start(); } catch (e) { } }
const SND = { click: () => tone(660, .08, 'square', .06), roll: () => noise(1.1, .18), hit: () => { noise(.35, .5); tone(180, .2, 'triangle', .2, 90); }, ok: () => { tone(660, .12); setTimeout(() => tone(880, .18), 110); }, bad: () => tone(220, .35, 'sawtooth', .08, 120), strike: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .25, 'triangle', .14), i * 110)), pw: () => [400, 600, 900].forEach((f, i) => setTimeout(() => tone(f, .15, 'sine', .12), i * 80)) };
function setMute() { $('bMute').textContent = 'Sound: ' + (MUTE ? 'off' : 'on'); }
$('bMute').onclick = () => { MUTE = !MUTE; ls.set('murly:bowl:mute', MUTE ? '1' : '0'); setMute(); }; setMute();

// ---------- balls (our own SVG) ----------
const BALLS = [
  ['Watermelon', 'stripes', '#3BAA4A', '#1E6B2C'], ['Orange', 'dots', '#FF9F1C', '#E07A00'], ['Basketball', 'basket', '#F07B2E', '#5A2A0A'], ['Football', 'soccer', '#FFFFFF', '#17181C'],
  ['Tennis', 'tennis', '#D8F04A', '#FFFFFF'], ['Planet', 'ring', '#8E7CF0', '#FFD25A'], ['Moon', 'craters', '#CFCFD8', '#9A9AAE'], ['Donut', 'donut', '#F7A8C9', '#FFF3B0'],
  ['Beach ball', 'beach', '#FF5D5D', '#4DA3FF'], ['Kiwi', 'kiwi', '#8BC34A', '#3E2A14'], ['Lemon', 'dots', '#FFE14D', '#E8C100'], ['Murly cat', 'cat', '#B8A7F5', '#3D2E8C'],
  ['Earth', 'earth', '#3E8EF7', '#43B85B'], ['Strawberry', 'seeds', '#E9314A', '#FFE07A'], ['Cookie', 'chips', '#D9A066', '#5A3418'], ['Bubblegum', 'swirl', '#FF8FCB', '#FFFFFF'],
  ['Galaxy', 'stars', '#2C2470', '#FFFFFF'], ['Candy', 'swirl', '#FF5D5D', '#FFFFFF'], ['Eyeball', 'eye', '#FFFFFF', '#3E8EF7'], ['Smiley', 'smile', '#FFD23F', '#17181C'],
  ['Lava', 'stripes', '#FF5B1F', '#FFD23F'], ['Ice', 'craters', '#BFEFFF', '#7FD3F2'], ['Mint', 'dots', '#7FE0B5', '#2E9C70'], ['Pizza', 'pizza', '#FFC94D', '#D9342B']];
function ballSVG(i, id) {
  const [, t, a, b] = BALLS[i]; const u = 'b' + i + (id || ''); let d = '';
  const C = `<clipPath id="${u}c"><circle cx="50" cy="50" r="46"/></clipPath>`;
  if (t === 'stripes') for (let k = 0; k < 6; k++) d += `<path d="M${10 + k * 16} 0 Q${30 + k * 16} 50 ${10 + k * 16} 100" stroke="${b}" stroke-width="6" fill="none"/>`;
  if (t === 'dots') for (let k = 0; k < 22; k++) d += `<circle cx="${(k * 37) % 92 + 4}" cy="${(k * 53) % 92 + 4}" r="2.6" fill="${b}"/>`;
  if (t === 'basket') d = `<path d="M50 4V96M4 50H96M18 14Q50 50 18 86M82 14Q50 50 82 86" stroke="${b}" stroke-width="3.5" fill="none"/>`;
  if (t === 'soccer') d = `<polygon points="50,32 66,44 60,63 40,63 34,44" fill="${b}"/>` + [[50, 4, 50, 32], [96, 40, 66, 44], [80, 92, 60, 63], [20, 92, 40, 63], [4, 40, 34, 44]].map(([x1, y1, x2, y2]) => `<path d="M${x1} ${y1}L${x2} ${y2}" stroke="${b}" stroke-width="3"/>`).join('') + `<polygon points="50,0 62,6 50,10 38,6" fill="${b}"/><polygon points="98,52 92,66 86,54" fill="${b}"/><polygon points="2,52 8,66 14,54" fill="${b}"/>`;
  if (t === 'tennis') d = `<path d="M14 18Q46 50 14 84M86 18Q54 50 86 84" stroke="${b}" stroke-width="5" fill="none"/>`;
  if (t === 'ring') d = `<circle cx="34" cy="36" r="8" fill="#fff" opacity=".35"/><circle cx="64" cy="66" r="12" fill="#000" opacity=".12"/>`;
  if (t === 'craters') d = [[30, 30, 10], [64, 26, 7], [58, 60, 13], [26, 66, 7], [80, 52, 5]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${b}"/>`).join('');
  if (t === 'donut') d = `<circle cx="50" cy="50" r="34" fill="${b}" opacity=".0"/><path d="M8 50Q14 18 50 12Q86 18 92 50Q80 44 70 52Q58 40 46 50Q34 42 24 54Q16 46 8 50Z" fill="#C46A35"/>` + [[30, 28, '#4DA3FF'], [50, 22, '#3DBE6E'], [70, 30, '#FFE07A'], [40, 40, '#fff'], [62, 42, '#4DA3FF']].map(([x, y, c]) => `<rect x="${x}" y="${y}" width="7" height="2.6" rx="1.3" fill="${c}" transform="rotate(${x * 7} ${x} ${y})"/>`).join('') + `<circle cx="50" cy="50" r="12" fill="#fff" stroke="#17181C" stroke-width="2"/>`;
  if (t === 'beach') d = `<path d="M50 50L50 0A50 50 0 0 1 93 25Z" fill="${b}"/><path d="M50 50L93 75A50 50 0 0 1 50 100Z" fill="#FFE07A"/><path d="M50 50L7 75A50 50 0 0 1 7 25Z" fill="#3DBE6E"/><circle cx="50" cy="50" r="7" fill="#fff"/>`;
  if (t === 'kiwi') { d = `<circle cx="50" cy="50" r="30" fill="#C5E86C"/><circle cx="50" cy="50" r="10" fill="#FFFBE6"/>`; for (let k = 0; k < 14; k++) { const g = k / 14 * Math.PI * 2; d += `<circle cx="${50 + Math.cos(g) * 19}" cy="${50 + Math.sin(g) * 19}" r="1.9" fill="${b}"/>`; } }
  if (t === 'cat') d = `<path d="M18 30L24 6L40 22ZM82 30L76 6L60 22Z" fill="${a}" stroke="${b}" stroke-width="3"/><circle cx="36" cy="48" r="5" fill="${b}"/><circle cx="64" cy="48" r="5" fill="${b}"/><path d="M44 62Q50 68 56 62" stroke="${b}" stroke-width="3" fill="none"/><path d="M47 56h6l-3 3z" fill="#F472B6"/><path d="M20 58h14M20 64h14M66 58h14M66 64h14" stroke="${b}" stroke-width="2"/>`;
  if (t === 'earth') d = `<path d="M20 26Q34 18 44 30Q40 44 26 42Q18 36 20 26ZM58 50Q76 44 84 60Q78 80 62 76Q54 64 58 50ZM40 66Q48 70 44 84Q34 80 40 66Z" fill="${b}"/>`;
  if (t === 'seeds') { for (let k = 0; k < 20; k++) d += `<ellipse cx="${(k * 29) % 84 + 8}" cy="${(k * 47) % 80 + 14}" rx="1.8" ry="3" fill="${b}"/>`; d += `<path d="M30 6Q50 18 70 6Q60 0 50 4Q40 0 30 6Z" fill="#3DBE6E"/>`; }
  if (t === 'chips') d = [[30, 30], [60, 24], [48, 52], [26, 64], [72, 58], [58, 80], [80, 38]].map(([x, y]) => `<path d="M${x} ${y}l5 2l-1 5l-5-1z" fill="${b}"/>`).join('');
  if (t === 'swirl') d = `<path d="M50 50m-6 0a6 6 0 1 1 12 0a12 12 0 1 1-24 0a18 18 0 1 1 36 0a24 24 0 1 1-48 0a30 30 0 1 1 60 0a36 36 0 1 1-72 0" stroke="${b}" stroke-width="6" fill="none"/>`;
  if (t === 'stars') for (let k = 0; k < 26; k++) d += `<circle cx="${(k * 41) % 92 + 4}" cy="${(k * 59) % 92 + 4}" r="${k % 5 ? 1.2 : 2.6}" fill="${b}"/>`;

  $('qbox').classList.add('on');
  let done = false; const finish = (ok) => { if (done) return; done = true; clearInterval(timerI); if (ok) SND.ok(); else SND.bad(); setTimeout(() => { $('qbox').classList.remove('on'); if (ok) aimPhase(); else { bigMsg('Oops! No roll'); setTimeout(() => endTurn(0), 1300); } }, ok ? 700 : 1100); };
  if (opts.length) $('qcard').querySelectorAll('.opts button').forEach((b) => b.onclick = () => { if (done) return; const ok = b.textContent === ans; b.classList.add(ok ? 'ok' : 'bad'); if (!ok) $('qcard').querySelectorAll('.opts button').forEach((x) => { if (x.textContent === ans) x.classList.add('ok'); }); finish(ok); });
  else { $('qShow').onclick = () => { $('qa').textContent = ans; SND.click(); }; $('qOk').onclick = () => finish(true); $('qNo').onclick = () => finish(false); }
  clearInterval(timerI); if (S.time) { let s = S.time; timerI = setInterval(() => { s--; if ($('qt')) $('qt').textContent = s; if (s <= 3 && s > 0) tone(880, .08, 'square', .06); if (s <= 0) finish(false); }, 1000); }
}
// aim meter: pointer sweeps 1..5; centre (3) is best
let aimRaf = 0;
function aimPhase() {
  $('meter').style.display = 'flex'; $('hint').textContent = 'Click or press SPACE to roll!';
  if (--G.pwNext <= 0) { G.pwNext = 3 + Math.floor(Math.random() * 3); $('pw').style.display = 'block'; }
  const m = $('meter'), p = $('ptr'); const W = 460; let x = 0, dir = 1, speed = 7 + Math.random() * 3;
  const step = () => { x += dir * speed; if (x > W) { x = W; dir = -1; } if (x < 0) { x = 0; dir = 1; } p.style.left = x + 'px'; aimRaf = requestAnimationFrame(step); }; step();
  const go = (e) => { if (e && e.target && e.target.closest && e.target.closest('.pw,.btn')) return; cancelAnimationFrame(aimRaf); document.removeEventListener('keydown', key); $('sGame').removeEventListener('pointerdown', go); $('hint').textContent = ''; roll(x / W); };
  const key = (e) => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); go(); } };
  setTimeout(() => { document.addEventListener('keydown', key); $('sGame').addEventListener('pointerdown', go); }, 250);
}
$('sGame').addEventListener('click', (e) => { if (e.target.closest('#pw')) openPower(); });
function roll(u) { // u 0..1, 0.5 = centre
  $('meter').style.display = 'none'; $('pw').style.display = 'none';
  const seg = Math.min(4, Math.floor(u * 5)); const off = (u - .5) * 2; // -1..1
  const aimX = off * .55 + rnd(-.06, .06);
  let n; if (seg === 2) n = Math.random() < .5 ? 10 : 7 + Math.floor(Math.random() * 3); else if (seg === 1 || seg === 3) n = 4 + Math.floor(Math.random() * 5); else n = Math.random() < .35 ? 0 : 1 + Math.floor(Math.random() * 3);
  SND.roll(); const b = $('bowl'); const T0 = performance.now(), D = 1150; const spin = 0;
  const anim = (now) => { const k = Math.min(1, (now - T0) / D); const e = 1 - Math.pow(1 - k, 1.6); const t = .02 + e * .93; const curve = Math.sin(k * Math.PI) * off * -.08; placeBall(t, aimX * k + curve * (1 - k)); b.style.transform = `rotate(${k * 900 * (off >= 0 ? 1 : -1)}deg)`; if (k < 1) requestAnimationFrame(anim); else knock(n, aimX); }; requestAnimationFrame(anim);
}
function knock(n, aimX) {
  if (n > 0) SND.hit(); else tone(140, .3, 'triangle', .1);
  // choose pins nearest to the hit line first
  const order = pins.map((p, i) => [Math.abs(+p.dataset.cx / 3 - aimX * 1.4) + Math.random() * .5 + PINPOS[i][1] * .12, p]).sort((a, c) => a[0] - c[0]).map((x) => x[1]);
  order.slice(0, n).forEach((p, i) => { const dir = (+p.dataset.cx - aimX * 3) >= 0 ? 1 : -1; setTimeout(() => { p.style.transform = `translate(${dir * rnd(20, 60)}px,${rnd(-50, -10)}px) rotate(${dir * rnd(70, 110)}deg)`; setTimeout(() => p.classList.add('fall'), 300); }, i * 45); });
  $('bowl').style.transition = 'opacity .4s'; setTimeout(() => { $('bowl').style.opacity = 0; }, 200);
  setTimeout(() => { $('bowl').style.opacity = 1; $('bowl').style.transition = 'none';
    let pts = n + (n === 10 ? 5 : 0); if (G.double[G.turn]) { pts *= 2; G.double[G.turn] = false; }
    if (n === 10) { SND.strike(); bigMsg('STRIKE!'); confetti(40); } else if (n === 0) bigMsg('Gutter ball!'); else bigMsg(n + (n === 1 ? ' pin' : ' pins') + (pts > n ? '  +' + pts : ''));
    setTimeout(() => endTurn(pts), 1400); }, 900);
}
function endTurn(pts) {
  G.score[G.turn] += pts; G.left--; renderBoard(); if (pts) { const el = $('sc' + G.turn); el.classList.add('bump'); }
  G.turn = (G.turn + 1) % TEAMS.length; setTimeout(nextTurn, 700);
}
// power-ups
const POWERS = [
  ['Double!', 'Your next roll counts double.', () => { G.double[G.turn] = true; }],
  ['+10 points', 'A gift from the Murly cat.', () => { G.score[G.turn] += 10; }],
  ['Swap!', 'Swap points with the leader.', () => { const top = G.score.indexOf(Math.max(...G.score)); [G.score[G.turn], G.score[top]] = [G.score[top], G.score[G.turn]]; }],
  ['Steal 5', 'Take 5 points from another team.', () => { const o = TEAMS.map((_, i) => i).filter((i) => i !== G.turn); if (o.length) { const v = o[Math.floor(Math.random() * o.length)]; const s = Math.min(5, G.score[v]); G.score[v] -= s; G.score[G.turn] += s; } }],
  ['Oh no! -5', 'The cat ate your points.', () => { G.score[G.turn] = Math.max(0, G.score[G.turn] - 5); }],
  ['Give 5', 'Be generous! Give 5 points to the last team.', () => { const o = TEAMS.map((_, i) => i).filter((i) => i !== G.turn); if (o.length) { const low = o.reduce((a, i) => (G.score[i] < G.score[a] ? i : a), o[0]); const s = Math.min(5, G.score[G.turn]); G.score[G.turn] -= s; G.score[low] += s; } }]];
function openPower() {
  $('pw').style.display = 'none'; SND.pw(); const p = POWERS[Math.floor(Math.random() * (TEAMS.length > 1 ? POWERS.length : 2))];
  p[2](); renderBoard(); bigMsg(p[0], 1600); $('hint').textContent = p[1] + '  Now roll!';
}
function confetti(n) { for (let i = 0; i < n; i++) { const c = document.createElement('i'); c.className = 'cf'; c.style.left = Math.random() * 1280 + 'px'; c.style.background = ['#FF9F1C', '#F472B6', '#5BC0F8', '#3DBE6E', '#FFE07A', '#7B5BD6'][i % 6]; c.style.animationDelay = Math.random() * .6 + 's'; $('stage').appendChild(c); setTimeout(() => c.remove(), 3400); } }
function endGame() {
  const order = TEAMS.map((t, i) => [G.score[i], t]).sort((a, b) => b[0] - a[0]); const tie = order.length > 1 && order[0][0] === order[1][0];
  $('winTitle').textContent = tie ? 'It\'s a draw!' : order[0][1].name + ' wins!';
  $('podium').innerHTML = order.map(([s, t], i) => `<div style="transform:translateY(${i * 24}px)">${ballSVG(t.ball, 'p' + i)}<div>${esc(t.name)}</div><div style="font-size:40px">${s}</div></div>`).join('');
  show('sEnd'); SND.strike(); confetti(90);
}
$('bStart').onclick = () => { SND.click(); startGame(); };
$('bAgain').onclick = () => { startGame(); };
$('bMenu').onclick = () => show('sSetup');
applyTheme();
if (P.get('teams')) { $('rTeams').value = P.get('teams'); $('rTeams').oninput(); }
if (P.get('shots')) { $('rShots').value = P.get('shots'); $('rShots').oninput(); }
</script>
